<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docker SAAS - Nginx</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: #e5e7eb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #020617;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 14px;
            background: #22c55e;
            color: black;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🐳 Custom Nginx Container</h1>
    <p>This container was created dynamically<br>from a Python SAAS application.</p>

    <div class="badge">RUNNING</div>

    <div class="footer">
        Docker • Flask • Linux
    </div>
</div>

</body>
</html>
